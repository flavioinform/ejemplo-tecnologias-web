<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 600px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="mb-0">Productos</h3>
      <button id="btnSalir" class="btn btn-outline-secondary btn-sm">Cerrar sesión</button>
    </div>

    <div class="card shadow mb-4">
      <div class="card-body p-4">
        <div id="mensaje"></div>

        <form id="formProducto">
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" required>
          </div>
          <div class="mb-3">
            <label for="precio" class="form-label">Precio</label>
            <input type="number" class="form-control" id="precio" step="0.01" min="0" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Guardar</button>
        </form>
      </div>
    </div>

    <table class="table table-striped bg-white shadow-sm">
      <thead>
        <tr><th>ID</th><th>Nombre</th><th>Precio</th></tr>
      </thead>
      <tbody id="listaProductos"></tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/productos.js"></script>
</body>
</html>
